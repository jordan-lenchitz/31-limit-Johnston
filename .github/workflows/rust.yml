name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose
    - name: Install Ansible
      run: pipx install --include-deps ansible-core || pip install ansible-core
    - name: Run Jinja2 Shadow Fuzzing Playbook
      working-directory: ansible
      run: ansible-playbook shadow_fuzz.yml
